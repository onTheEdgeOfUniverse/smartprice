<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoundFigure: Shopping Price Rounder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icon48.png" alt="RoundFigure Logo" class="logo">
      <div>
        <h1 class="title">RoundFigure</h1>
        <p class="subtitle">Shopping Price Rounder</p>
      </div>
    </header>

    <div class="status-card">
      <div class="card-header">
        <span class="mode-name">Auto-Rounding</span>
        <span class="badge active-badge">Always Active</span>
      </div>
      <p class="card-desc">Automatically simplifies deceptive product prices (.99, 999) to clean whole numbers on shopping sites.</p>
      <div class="example-box">
        <span class="original-val">₹2,899</span>
        <span class="arrow">→</span>
        <span class="preview-val">₹2,900</span>
      </div>
    </div>

    <footer class="footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">Active on shopping & search</span>
      </div>
    </footer>
  </div>
</body>
</html>
